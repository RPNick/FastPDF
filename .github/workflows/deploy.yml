name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Build & push Docker image ──────────────────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha_tag=$SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fastpdf:latest
            ${{ secrets.DOCKER_USERNAME }}/fastpdf:${{ steps.meta.outputs.sha_tag }}

  # ── 2. Deploy to Server A ─────────────────────────────────────────────────
  deploy-server-a:
    name: Deploy → Server A
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy to Server A
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_A_HOST }}
          username: forge
          key:      ${{ secrets.SERVER_A_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/forge/fastpdf
            docker pull ${{ secrets.DOCKER_USERNAME }}/fastpdf:latest
            docker compose up -d --remove-orphans
            docker image prune -f
            # Verify the container is healthy before finishing
            sleep 10
            docker compose ps | grep -q "healthy" || (echo "Container not healthy" && exit 1)

  # ── 3. Deploy to Server B ─────────────────────────────────────────────────
  deploy-server-b:
    name: Deploy → Server B
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy to Server B
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_B_HOST }}
          username: forge
          key:      ${{ secrets.SERVER_B_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/forge/fastpdf
            docker pull ${{ secrets.DOCKER_USERNAME }}/fastpdf:latest
            docker compose up -d --remove-orphans
            docker image prune -f
            sleep 10
            docker compose ps | grep -q "healthy" || (echo "Container not healthy" && exit 1)
