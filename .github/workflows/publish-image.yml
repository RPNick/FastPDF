name: Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Ensure package version is set
        run: |
          if [ -z "${{ steps.package-version.outputs.version }}" ]; then
            echo "Package version is empty. Aborting."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastpdf:${{ steps.package-version.outputs.version }}

      - name: Show published image refs
        run: |
          echo "Published tag: ${{ secrets.DOCKER_USERNAME }}/fastpdf:${{ steps.package-version.outputs.version }}"
          echo "Digest: ${{ steps.build-and-push.outputs.digest }}"